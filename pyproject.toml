[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "groundkit"
version = "0.1.0.dev0"
description = "Grounded, citation-verifiable hybrid retrieval: persisted BM25 + dense index, MCP server, and a retrieval eval harness. Local-first."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andy Freeman" }]
keywords = ["retrieval", "rag", "mcp", "search", "bm25", "embeddings"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
# Runtime dependencies land with the phase that needs them (SPEC.md phase plan).
#
# FastAPI, uvicorn and the MCP SDK are BASE requirements, not an extra
# (ADR-0015). The rule that decides it, stated so it decides future cases too:
# an extra may gate an *option* on a command; it may not gate the *command
# itself*. `--dense` and `--rerank` are options, so `dense` and `rerank` stay
# extras below. `serve-mcp` is a command, and it is the command SPEC.md §9
# names as Phase 4's deliverable -- behind an extra it could only ever raise a
# ConfigurationError on a default install, which would make SPEC.md §1.2's
# "real and installable, not a demo" false in the most literal way available.
dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  # Floor at the release this surface was written and verified against: the
  # SDK's tool-dispatch and streamable-HTTP APIs moved across 1.x minors, and
  # `service/mcp_server.py` depends on specifics of both (it registers raw
  # generated input schemas through the low-level Server, and mounts
  # StreamableHTTPSessionManager on the FastAPI app). A lower floor would
  # advertise compatibility nothing checks.
  "mcp>=1.29,<2",
  # OTel's own base/extra split (Phase 6, ADR-0022 decision 1): the API is pure
  # Python with no transport, and with no SDK configured every span it creates
  # is non-recording — no export, no collector, no error. Putting it here means
  # instrumentation sites (telemetry.py and the ingest/retrieve/synthesize span
  # sites) import it unconditionally, with no guarded import and no
  # hand-rolled no-op shim to keep in signature parity by hand — this repo
  # already has a written position on exactly that failure mode
  # (tests/test_protocol_conformance.py). The SDK and OTLP exporter that
  # actually ship a span live in the `otel` extra below.
  "opentelemetry-api>=1.27,<2",
]

[project.urls]
Homepage = "https://github.com/tafreeman/groundkit"
Repository = "https://github.com/tafreeman/groundkit"
Documentation = "https://tafreeman.github.io/groundkit/"
Issues = "https://github.com/tafreeman/groundkit/issues"
Changelog = "https://github.com/tafreeman/groundkit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Dense retrieval backend (Phase 3, ADR-0004). Optional so a BM25-only install
# stays light — but pinned in the dev group below as well, because CI must
# actually exercise the backend rather than skip it: no job that is the sole
# proof of a backend may be continue-on-error (SPEC.md §3).
dense = [
  "lancedb>=0.13,<1",
]
# Cross-encoder rerank (Phase 3 Wave D, ADR-0005 decision 4). Deliberately
# *not* mirrored into the dev group, unlike `dense` above: torch is a
# multi-gigabyte install and Wave D's plan requires that CI's default job never
# pull it. The backend is proved instead by the gated suite
# (`RERANK_GATED=1 uv run pytest tests/test_rerank_gated.py`), which is the sole
# proof of this backend and is correspondingly never `continue-on-error`
# (SPEC.md §3). Everything in `retrieval/rerank.py` that does not need a model —
# the sigmoid, the ordering, the contract re-validation, every failure path — is
# pure and covered by the default suite.
rerank = [
  "sentence-transformers>=3,<6",
]
# Tracing SDK + OTLP exporters (Phase 6, ADR-0022 decision 1). `opentelemetry-api`
# stays a base dependency above so instrumentation sites need no guarded
# imports; this extra is what makes a span actually export anywhere. Both wire
# protocols ship together rather than as separate extras: `OTEL_EXPORTER_OTLP_PROTOCOL`
# picks between them at runtime (`configure_tracing`), and a two-extra split
# would just move the same "which protocol does my collector speak" question
# from configuration time to install time. Pinned in the dev group below too,
# for the same reason `dense` is pinned there: the instrumentation tests need
# the SDK's `InMemorySpanExporter` to assert a span was recorded and that the
# attribute allowlist (decision 3) holds at runtime, and need both exporter
# packages importable to prove `configure_tracing` actually selects between
# them rather than only claiming to — a test that silently skips because a
# package is absent proves nothing, which is the same principle behind
# SPEC.md §3's rule that no job which is the sole proof of a backend may be
# continue-on-error.
otel = [
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2",
]

[project.scripts]
grk = "groundkit.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.12,<1",
  "mypy>=1.13,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "pip-audit>=2.7,<3",
  "pre-commit>=4,<6",
  "lancedb>=0.13,<1",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2",
]
# Docs site (Phase 7). A separate group, not part of `dev`: the docs build is
# its own CI job and its own gate, and every other job — lint, typecheck, the
# three-version test matrix, audit — would otherwise pay to install a static
# site generator it never invokes.
#
# `mkdocstrings` imports groundkit to render the API reference, which is what
# makes the strict docs build a real check on the package's docstrings rather
# than on its prose alone. It is also why the docs job installs the `dense`
# extra: `retrieval/` and `index/` import lancedb-backed modules, and a
# missing optional dependency surfaces as a broken API page, not an import
# error the build would otherwise swallow.
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
  "mkdocstrings[python]>=0.26,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/groundkit"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest asserts. ARG002: protocol-conformant test fakes must keep the
# protocol's exact parameter names (mypy structural typing), used or not.
"tests/**" = ["S101", "ARG002"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/groundkit", "tests"]
# "tests" is on the path so cross-test helper imports (e.g. the shared
# assert_signature_parity conformance helper) resolve under mypy the same way
# pytest resolves them at run time. Without it the checked file set silently
# diverges from the executed one.
mypy_path = ["src", "tests"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Two coverage gates run in CI, neither able to hide the other: whole-package
# (this table, fail_under below) and the SPEC.md §8 core subset
# ([tool.groundkit.coverage] below, enforced by a separate `coverage report
# --include=...` step in ci.yml so a well-covered peripheral module — e.g.
# providers/embeddings.py, an optional provider — can never offset an
# under-tested core module). precision = 2 so 79.99% fails instead of
# rounding up.
[tool.coverage.run]
source = ["groundkit"]

[tool.coverage.report]
fail_under = 80
precision = 2

# SPEC.md §8: "coverage floor 80% on the core subset (retrieval, chunking,
# scoring, citation resolution — subset defined in pyproject.toml when Phase
# 1 lands, optional providers excluded, README states the subset honestly)."
# ci.yml's core-subset gate step derives its `coverage report --include=`
# patterns from this list so the two cannot drift out of sync.
#
# The `index/` entries are enumerated file-by-file, unlike the `retrieval/*`
# glob, because the reasoning for each is per-file. Two consequences that must
# not be left to omission (Phase 3 Wave F):
#
# 1. `index/dense.py` is IN, added in Wave F. It is scoring — `_cosine_similarity`,
#    `_clamp_score`, `_matches_filter`, `_sort_by_score` — the vector peer of
#    `bm25.py`, and it holds both live ADR-0001 hazards (3 and 5). Hazard 3 has
#    already demonstrated that an ungated guard decays quietly: Wave A's filter
#    tests seeded every chunk with the filter's key, so the membership guard
#    survived its own mutation untested. `retrieval/fusion.py` is already gated
#    by the glob above, so leaving `dense.py` out gated the combiner but not one
#    of its two inputs.
#
#    Caveat, recorded because it is the honest cost: `dense.py` is a MIXED file
#    — roughly two-thirds shared helpers plus `InMemoryVectorStore`, one-third
#    `LanceDBVectorStore` behind the optional `dense` extra. Gating it wholesale
#    admits, inside one file, the offsetting this subset exists to prevent:
#    well-covered LanceDB rows can mask a thin in-memory path, or the reverse,
#    and the gate cannot see the difference. Accepted only because `lancedb` is
#    pinned in the dev group above, so CI genuinely covers both halves — that is
#    a convention, not an invariant, and it is what makes this safe. Splitting
#    `LanceDBVectorStore` into its own module is the clean fix; it is a real
#    refactor with its own ADR, deliberately not ridden along here.
#
# 2. `index/metadata.py` stays OUT, and "it is core, so gate it" is not a reason
#    to add it — that argument proves too much. `metadata.py` is the durable
#    truth (ADR-0002) and is equally core by that test, which is exactly why the
#    per-file reasoning above is written down rather than generalized into a
#    rule. Stated explicitly so the next reader does not reopen it.
#
# 3. `runtime.py` is IN, added by ADR-0013 as an EXPLICIT path rather than by
#    placement. It sits at the package root, so no glob catches it, and that was
#    the choice: it follows `identity.py`'s placement (a module outside whichever
#    caller needed it first, so sharing it creates no ingest/retrieval
#    dependency) while the entry below — not the directory — is what puts it
#    under the gate. Placing it in `retrieval/` to be caught by the glob would
#    have bought the same gate at the price of putting a composition root that
#    imports `index.metadata` inside the retrieval package.
#
#    It is gated because it decides whether an answer is computed over CURRENT
#    data — a stronger retrieval-correctness claim than fusion's ordering, which
#    the glob already gates. Its hardest code is the single-flight and
#    cancellation paths, which are unreachable on a non-failing path and
#    therefore invisible to both coverage and a green suite; a floor is the only
#    automated pressure on them.
#
#    The honest asymmetry: the staleness marker's READ is gated here, while its
#    BUMP lives in `index/metadata.py`, which item 2 keeps out. The half whose
#    omission causes silent staleness is ungoverned by this gate, and
#    `test_metadata_store.py`'s parameterized bump test plus its protocol
#    classification guard are what stand in for it.
#
# 4. `telemetry.py` (Phase 6, ADR-0022) sits at the package root exactly like
#    `runtime.py` above, so no glob here catches it either — and note 3's own
#    entry is the precedent that a root module is added HERE, explicitly, when
#    it belongs. This is the other side of that precedent: telemetry.py is
#    deliberately left OUT, and the omission is argued rather than left
#    silent, because an omission with no reasoning breaks this file's
#    convention just as much as an entry without one.
#
#    Note 3 argues runtime.py's inclusion on a specific test: whether a module
#    decides an answer is correct or current. telemetry.py fails that test in
#    the direction that keeps it out — a tracer's absence changes no answer
#    (ADR-0022 decision 1). With no `otel` extra installed, every span it
#    creates is non-recording: no export, no config, no error, and nothing
#    about what `grk search` returns changes. With the extra installed, the
#    module still decides nothing about the response — only what gets shipped
#    to a collector alongside it. It is covered by the whole-package 80% gate
#    instead, the same treatment `service/` gets for the same reason.
[tool.groundkit.coverage]
core_subset = [
  "src/groundkit/retrieval/*",            # search orchestration + citation resolution
  "src/groundkit/ingestion/chunking.py",  # chunking
  "src/groundkit/index/bm25.py",          # lexical scoring
  "src/groundkit/index/dense.py",         # vector scoring (Wave F; see caveats above)
  "src/groundkit/runtime.py",             # collection lifecycle (ADR-0013; see note 3)
]
