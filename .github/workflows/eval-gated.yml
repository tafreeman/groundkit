# Real-model retrieval eval (SPEC.md §6's `EVAL_GATED=1` workflow).
#
# Separate from `ci.yml` on purpose. The default suite must stay offline and
# credential-free, and `InMemoryEmbedder`'s hash-derived vectors cannot
# produce a retrieval-quality number without violating SPEC.md §2 — so the
# only honest dense/fusion delta comes from a real embedding model, which
# means a running Ollama, which cannot be a precondition of every PR.
#
# This workflow is therefore opt-in and never blocks a PR: it runs on a
# schedule, on demand, and on a PR only when explicitly labelled. Nothing
# here is `continue-on-error` — SPEC.md §3 forbids that for a job that is the
# sole proof of a backend, and this is the sole proof of the Ollama path.
name: eval-gated

on:
  schedule:
    # Weekly, Mondays 06:00 UTC. Frequent enough to catch a broken real-model
    # path within a week; rare enough not to pull a model image daily.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  gated-eval:
    runs-on: ubuntu-latest
    # On a PR this runs only when the label is present. Scheduled and manual
    # runs always proceed. Without this guard the job would pull a model on
    # every PR, which is exactly the cost the gate exists to avoid.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'eval-gated')
    timeout-minutes: 30

    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434

    env:
      GROUNDKIT_EVAL_EMBED_MODEL: nomic-embed-text
      GROUNDKIT_EVAL_EMBED_DIMENSIONS: "768"
      GROUNDKIT_EVAL_EMBED_BASE_URL: http://localhost:11434

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --locked --group dev

      - name: Wait for Ollama to accept connections
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf "$GROUNDKIT_EVAL_EMBED_BASE_URL/api/tags" >/dev/null; then
              echo "Ollama is up after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "Ollama did not become ready within 60s." >&2
          exit 1

      - name: Pull the embedding model
        run: |
          curl -sf -X POST "$GROUNDKIT_EVAL_EMBED_BASE_URL/api/pull" \
            -H 'Content-Type: application/json' \
            -d "{\"name\": \"$GROUNDKIT_EVAL_EMBED_MODEL\"}" \
            -o /dev/null
          # Prove the model is actually resident rather than trusting the
          # pull's exit code: /api/pull streams progress and can report
          # success for a partially-completed transfer.
          curl -sf "$GROUNDKIT_EVAL_EMBED_BASE_URL/api/tags" \
            | grep -q "$GROUNDKIT_EVAL_EMBED_MODEL"

      - name: Run the gated eval tests
        env:
          EVAL_GATED: "1"
        run: uv run pytest tests/test_eval_gated.py -v

      # Produces the artifact a human reads for the actual delta. The tests
      # above assert the run is honest; this step is what makes the numbers
      # available, since no metric value may be committed to a doc
      # (SPEC.md §2) and `evals/results/` is gitignored.
      - name: Generate the real-model eval report
        run: |
          uv run grk eval --dense \
            --embed-provider ollama \
            --embed-model "$GROUNDKIT_EVAL_EMBED_MODEL" \
            --embed-dimensions "$GROUNDKIT_EVAL_EMBED_DIMENSIONS" \
            --embed-base-url "$GROUNDKIT_EVAL_EMBED_BASE_URL"

      - name: Upload the eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-real-model
          path: evals/results/latest.json
          if-no-files-found: error
