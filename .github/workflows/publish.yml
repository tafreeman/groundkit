# Publish groundkit to PyPI (SPEC.md §9, Phase 7).
#
# PyPI **trusted publishing** via GitHub OIDC: `id-token: write` is the entire
# authentication mechanism. No PyPI API token is stored in this repository, its
# secrets, or its environments, and none is referenced below. Before the first
# release this workflow is inert in the safe direction — with no trusted
# publisher registered on pypi.org it fails at the upload step with an explicit
# "no matching trusted publisher" error rather than silently no-opping a real
# release intent.
#
# TRIGGER — `release: published`, not `push: tags`.
#
# The portfolio has both patterns and they are not interchangeable here.
# executionkit publishes on a pushed `v*` tag; agentic-evalkit publishes on a
# published release. A tag alone does not create a release object, so
# `GET /repos/tafreeman/groundkit/releases/latest` stays 404 forever under the
# tag-triggered pattern — and that endpoint is exactly what the README's
# version badge reads. SPEC.md §2 permits a number in a doc only when it comes
# from a generated artifact or a dynamic badge, and Phase 7's deliverable is
# "README live badges only". A tag trigger would leave the one badge that
# states the released version permanently empty, with no honest way to fill it
# in. Publishing on a published release is what makes the badge's data source
# exist, so the trigger follows from the badge policy rather than from taste.
#
# The secondary effect is a safety one and points the same way: a release is a
# deliberate, reviewable act with a body and a human behind it, while a tag can
# be pushed by accident. Publishing to PyPI is irreversible — a version number
# can be yanked but never reused.
name: publish

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Unlike ci.yml, an in-flight upload is never cancelled by a second trigger:
  # a half-published release is worse than a duplicate run, which PyPI rejects
  # harmlessly as a re-upload of an existing version.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The full offline release-gate suite, as an actual blocking dependency of
  # the upload rather than a checklist someone is trusted to have dispatched.
  # This is the one deliberate departure from agentic-evalkit's shape, whose
  # release-gates.yml is `workflow_dispatch`-only and therefore blocks nothing:
  # it documents the gates without enforcing them. SPEC.md §8 ("a failing gate
  # blocks the phase") reads as a requirement that the gate be in the path.
  gates:
    uses: ./.github/workflows/release-gates.yml
    with:
      # The release tag is the version claim under review. The gate refuses to
      # let a tag and pyproject.toml's version disagree — see the parity step
      # in release-gates.yml for why that check has to live at release time.
      expected-version-ref: ${{ github.event.release.tag_name }}

  build:
    name: build distribution
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: uv build

      - name: Verify both artifact kinds exist and are well-formed
        run: |
          test -n "$(find dist -maxdepth 1 -name '*.tar.gz')"
          test -n "$(find dist -maxdepth 1 -name '*.whl')"
          uvx twine check --strict dist/*

      # Recorded as a build artifact rather than attached to the release: the
      # workflow holds `contents: read`, and widening it to write just to
      # upload an SBOM would grant this workflow the ability to mutate the
      # repository it is publishing from.
      #
      # `requirements`, NOT `environment`. `cyclonedx-py environment` inventories
      # the environment of the interpreter running it — under `uvx` that is the
      # ephemeral tool environment holding cyclonedx-bom and its own transitive
      # dependencies. Run here it produced a 33-component SBOM whose root
      # component was null, which listed `cyclonedx-bom`, `jsonschema` and
      # `defusedxml`, and which contained neither groundkit nor a single one of
      # its dependencies: not fastapi, not mcp, not httpx, not pydantic. It is
      # the worst shape a supply-chain artifact can take — well-formed, validating
      # cleanly, attached to the release, and describing a different piece of
      # software entirely.
      #
      # The lockfile is the honest source instead. `--no-dev` keeps ruff/pytest
      # out of a consumer-facing document, `--all-extras` puts every optional
      # backend in (the export resolves metadata and installs nothing, so naming
      # `rerank` here costs no torch download), and `--pyproject` sets the root
      # component to groundkit itself, which the environment mode never had.
      # `uv export` also refuses a drifted lockfile, so a release cannot ship an
      # SBOM describing a dependency set that is not the one being published.
      - name: Generate SBOM
        run: |
          uv export --no-dev --all-extras --no-emit-project \
            --format requirements.txt -o sbom-requirements.txt
          uvx --from cyclonedx-bom cyclonedx-py requirements sbom-requirements.txt \
            --pyproject pyproject.toml --mc-type library \
            --of JSON --output-file sbom.json

      # The defect above was silent: the artifact was generated, uploaded and
      # retained for a year while describing the wrong software. Nothing failed,
      # so nothing drew attention to it. This step is what makes the next such
      # regression loud — it asserts the two properties whose absence defined
      # the defect (the SBOM describes groundkit; it inventories groundkit's
      # dependencies) rather than merely that a file was produced.
      - name: Verify the SBOM describes this project
        run: |
          python3 - <<'PY'
          import json, sys

          bom = json.load(open("sbom.json", encoding="utf-8"))
          root = bom.get("metadata", {}).get("component") or {}
          names = {c["name"].lower() for c in bom.get("components", [])}

          problems = []
          if root.get("name") != "groundkit":
              problems.append(f"root component is {root.get('name')!r}, expected 'groundkit'")
          # Base dependencies, per pyproject's [project.dependencies]. Every one
          # of these was missing from the environment-mode SBOM.
          for required in ("fastapi", "mcp", "httpx", "pydantic", "uvicorn"):
              if required not in names:
                  problems.append(f"missing base dependency {required!r}")
          # The tell-tale of the environment-mode defect: the SBOM generator
          # inventorying itself.
          if "cyclonedx-bom" in names:
              problems.append("'cyclonedx-bom' is present, so this inventories the tool env")

          if problems:
              print("SBOM does not describe this project:", file=sys.stderr)
              for problem in problems:
                  print(f"  - {problem}", file=sys.stderr)
              sys.exit(1)
          print(f"SBOM OK: root={root.get('name')} {root.get('version')}, {len(names)} components")
          PY

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Register this exact repository + workflow filename (`publish.yml`) +
    # environment name (`pypi`) as the trusted publisher on the PyPI project
    # page. Protection rules on the `pypi` environment (required reviewers) are
    # the human stop between a published release and an irreversible upload.
    environment:
      name: pypi
      url: https://pypi.org/p/groundkit
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
