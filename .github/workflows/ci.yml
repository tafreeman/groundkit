name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --locked --group dev
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group dev
      - run: uv run pytest --cov --cov-report=term
      # Dedicated gate step: pytest-cov does not reliably propagate the
      # fail-under exit code; `coverage report` honors [tool.coverage.report].
      - run: uv run coverage report
      # SPEC.md §8 core-subset gate: the whole-package gate above cannot
      # catch a well-covered peripheral module (e.g. providers/embeddings.py,
      # an optional provider) offsetting an under-tested core module.
      # Patterns come from pyproject.toml's [tool.groundkit.coverage]
      # core_subset so the two gates cannot drift apart.
      - name: Core-subset coverage gate (SPEC.md §8)
        run: |
          PATTERN=$(uv run python -c "import tomllib; print(','.join(tomllib.load(open('pyproject.toml', 'rb'))['tool']['groundkit']['coverage']['core_subset']))")
          uv run coverage report --include="$PATTERN" --fail-under=80

  # SPEC.md §10 names the strict docs build as part of CI green, so it is a
  # first-class job rather than a step bolted onto `lint`.
  #
  # `--strict` promotes MkDocs warnings to errors, which makes this a real
  # gate on three things prose review does not catch: a relative link to a
  # page that no longer exists, a `#fragment` no heading produces, and a new
  # page under docs/ that was never added to `nav` (the recurring case is a
  # freshly landed ADR — the record gets written and the nav entry is the
  # half that gets forgotten).
  #
  # The `dense` extra is not decoration here: mkdocstrings imports groundkit
  # to render the API reference, so a missing optional dependency would
  # surface as a silently thin page rather than an import error.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --locked --group docs --extra dense
      - run: uv run mkdocs build --strict

  # SPEC.md §1.4 requires each IaC path be "verified to work". A GitHub runner
  # has a Docker daemon and can reach a registry, which is more than the machine
  # this infrastructure was written on had (see
  # docs/specs/phase-6-iac-observability.md §6.1) — so this job is where several
  # of those verifications actually happen, on every pull request rather than
  # once by hand.
  #
  # NOT continue-on-error, per SPEC.md §3: this job is the sole proof that the
  # image builds at all.
  infra:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@v7
      # For the two YAML-parsing steps below. `uv run --no-project --with` gives
      # them an ephemeral interpreter with PyYAML rather than relying on
      # whatever the runner image happens to ship, and uses the tool every other
      # job here already uses.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      # -- compose ------------------------------------------------------
      # Parses, interpolates and resolves every service. Needs no daemon.
      - name: Compose file is valid
        run: docker compose -f infra/compose/docker-compose.yml config -q

      # A pinned tag is a claim about a registry. `imagetools inspect` resolves
      # the manifest without downloading layers, which turns the pin into a
      # checked claim rather than a guess — the tags in this repo were chosen
      # without a container runtime available to confirm them. buildx rather
      # than `docker manifest inspect` because the latter is still gated behind
      # the experimental CLI flag.
      - name: Pinned third-party image tags resolve
        run: |
          set -euo pipefail
          docker compose --profile ingest --profile setup \
            -f infra/compose/docker-compose.yml config --images \
            | grep -v '^groundkit:local$' > images.txt
          uv run --no-project --with pyyaml python - <<'PY' >> images.txt
          import glob
          import yaml
          # Recursive: the ingest Job lives in its own kustomization directory so
          # the image override reaches it, and a non-recursive glob would have
          # quietly stopped covering it the moment it moved.
          for path in sorted(glob.glob("infra/k8s/**/*.yaml", recursive=True)):
              for doc in yaml.safe_load_all(open(path, encoding="utf-8")):
                  if not isinstance(doc, dict):
                      continue
                  spec = doc.get("spec") or {}
                  pod = (spec.get("template") or {}).get("spec") or spec
                  for container in pod.get("containers") or []:
                      image = container["image"]
                      # The groundkit reference is a documented placeholder:
                      # no image is published to any registry (ADR-0021).
                      if not image.startswith("ghcr.io/tafreeman/groundkit"):
                          print(image)
          PY
          sort -u -o images.txt images.txt
          cat images.txt
          while read -r image; do
            echo "::group::$image"
            docker buildx imagetools inspect "$image" > /dev/null
            echo "::endgroup::"
          done < images.txt

      # -- image --------------------------------------------------------
      - name: Image builds
        run: docker build -f infra/docker/Dockerfile -t groundkit:ci .

      # The three properties ADR-0021 decisions 2 and 3 make part of the image's
      # contract, checked against the built image rather than against the
      # Dockerfile's text.
      - name: Image runs as uid 10001 and its CLI works
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id groundkit:ci -u)" = "10001"
          docker run --rm groundkit:ci --version
          # Read-only root plus the two named scratch mounts is the deployed
          # shape; if a future change writes somewhere else, this fails here
          # rather than in production.
          docker run --rm --read-only \
            --tmpfs /tmp:mode=1777 \
            --tmpfs /home/groundkit:mode=0700,uid=10001,gid=10001 \
            groundkit:ci --help > /dev/null

      # -- kubernetes ---------------------------------------------------
      - name: Install kubectl
        run: |
          set -euo pipefail
          # Installed explicitly rather than relying on the runner image's tool
          # list: this job is a gate, and a gate that silently stops running
          # because a preinstalled binary moved is worse than no gate.
          version="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          curl -fsSL -o kubectl \
            "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          rm -f kubectl
          kubectl version --client

      # Offline: `kustomize` renders without contacting a cluster. It catches a
      # missing resource, a broken patch, and a manifest that is not valid YAML.
      # It does NOT validate against a cluster's schema — that needs a cluster,
      # and infra/README.md's status table says so.
      - name: Kubernetes manifests render and parse
        run: |
          set -euo pipefail
          kubectl kustomize infra/k8s > rendered.yaml
          kubectl kustomize infra/k8s/ingest > rendered-ingest.yaml
          uv run --no-project --with pyyaml python - <<'PY'
          import glob
          import yaml

          def load(path):
              return [d for d in yaml.safe_load_all(open(path, encoding="utf-8")) if d]

          base = load("rendered.yaml")
          kinds = sorted(d["kind"] for d in base)
          print("base:", kinds)
          assert kinds == [
              "Deployment", "Namespace", "NetworkPolicy", "PersistentVolumeClaim", "Service"
          ], kinds

          # The NetworkPolicy is what actually closes in-cluster reachability
          # (ADR-0021 decision 1); a ClusterIP alone does not. Asserted here
          # because its absence looks like nothing at all — the service keeps
          # working, just reachable from every pod in the cluster.
          policy = next(d for d in base if d["kind"] == "NetworkPolicy")
          assert policy["spec"]["podSelector"] == {}, "policy must select every pod"
          assert policy["spec"]["policyTypes"] == ["Ingress"], policy["spec"]["policyTypes"]
          assert "ingress" not in policy["spec"], "an ingress rule would un-deny the default-deny"

          # The ingest Job renders from its own kustomization so the image
          # transformer reaches it. Applied with `-f` it kept the unpublished
          # placeholder and the documented workflow ended in ImagePullBackOff.
          ingest = load("rendered-ingest.yaml")
          assert [d["kind"] for d in ingest] == ["Job"], [d["kind"] for d in ingest]

          for path in sorted(glob.glob("infra/k8s/**/*.yaml", recursive=True)):
              assert load(path), f"{path} parsed to nothing"
          print("all infra/k8s manifests parse")
          PY

      # -- terraform ----------------------------------------------------
      - uses: hashicorp/setup-terraform@v3
        with:
          # Pinned to the version the module was written and validated against.
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ hashFiles('infra/terraform/**/versions.tf') }}
          restore-keys: tf-plugins-

      - name: Terraform module is formatted and valid
        working-directory: infra/terraform/aws-ec2
        run: |
          set -euo pipefail
          mkdir -p "${TF_PLUGIN_CACHE_DIR}"
          terraform fmt -check -diff -recursive .
          # -backend=false: this is a reusable module, not a root configuration,
          # so it has no backend and no state. `validate` resolves the provider
          # schema and every expression, including the user_data templatefile
          # call — it does NOT make an API call, so a missing IAM permission or
          # an AMI filter that matches nothing stays invisible to it.
          terraform init -backend=false -input=false
          terraform validate -no-color

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --locked --group dev
      - run: uv export --no-emit-project --group dev --format requirements.txt -o requirements-audit.txt
      - run: uv run pip-audit -r requirements-audit.txt --disable-pip

  secrets:
    runs-on: ubuntu-latest
    # Narrower than widening the workflow-level grant: only this job needs to
    # read the PR's commit list, and only on pull_request events.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          # Required for pull_request scans since gitleaks-action v2.3.0;
          # push-only runs did not need it, so this first PR is where its
          # absence surfaced.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
