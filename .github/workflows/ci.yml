name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --locked --group dev
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group dev
      - run: uv run pytest --cov --cov-report=term
      # Dedicated gate step: pytest-cov does not reliably propagate the
      # fail-under exit code; `coverage report` honors [tool.coverage.report].
      - run: uv run coverage report
      # SPEC.md §8 core-subset gate: the whole-package gate above cannot
      # catch a well-covered peripheral module (e.g. providers/embeddings.py,
      # an optional provider) offsetting an under-tested core module.
      # Patterns come from pyproject.toml's [tool.groundkit.coverage]
      # core_subset so the two gates cannot drift apart.
      - name: Core-subset coverage gate (SPEC.md §8)
        run: |
          PATTERN=$(uv run python -c "import tomllib; print(','.join(tomllib.load(open('pyproject.toml', 'rb'))['tool']['groundkit']['coverage']['core_subset']))")
          uv run coverage report --include="$PATTERN" --fail-under=80

  # SPEC.md §10 names the strict docs build as part of CI green, so it is a
  # first-class job rather than a step bolted onto `lint`.
  #
  # `--strict` promotes MkDocs warnings to errors, which makes this a real
  # gate on three things prose review does not catch: a relative link to a
  # page that no longer exists, a `#fragment` no heading produces, and a new
  # page under docs/ that was never added to `nav` (the recurring case is a
  # freshly landed ADR — the record gets written and the nav entry is the
  # half that gets forgotten).
  #
  # The `dense` extra is not decoration here: mkdocstrings imports groundkit
  # to render the API reference, so a missing optional dependency would
  # surface as a silently thin page rather than an import error.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --locked --group docs --extra dense
      - run: uv run mkdocs build --strict

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --locked --group dev
      - run: uv export --no-emit-project --group dev --format requirements.txt -o requirements-audit.txt
      - run: uv run pip-audit -r requirements-audit.txt --disable-pip

  secrets:
    runs-on: ubuntu-latest
    # Narrower than widening the workflow-level grant: only this job needs to
    # read the PR's commit list, and only on pull_request events.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          # Required for pull_request scans since gitleaks-action v2.3.0;
          # push-only runs did not need it, so this first PR is where its
          # absence surfaced.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
