version: 2
updates:
  # uv.lock is the single source of dependency truth (CI installs with
  # `uv sync --locked`), so Dependabot updates it directly. Minor and patch
  # bumps arrive as one grouped PR; majors stay separate so each gets a
  # deliberate review.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # mcp 2.x replaces the low-level Server decorator API with on_list_tools /
      # on_call_tool callbacks, so it is a planned migration of the service
      # surface, not a bump. pyproject caps mcp<2 until that work is scheduled.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]

  # No docker entry: infra/docker/Dockerfile takes its base-image versions from
  # build ARGs (UV_VERSION, PYTHON_VERSION), which Dependabot cannot update.
