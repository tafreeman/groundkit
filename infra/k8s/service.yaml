# ClusterIP, which closes EXTERNAL publication and nothing more.
#
# `NodePort` or `LoadBalancer` here would publish an UNAUTHENTICATED,
# content-bearing surface — document text and absolute source paths over
# `search`, collection topology over `index_status` and `list_collections` — to
# whoever can reach the node or the load balancer. Phase 4 ships no
# authentication of any kind (ADR-0014 decision 1), so there is nothing behind
# this Service to stop them.
#
# **A ClusterIP is not an access boundary, and this comment used to imply it
# was.** Every pod in every namespace, and the nodes themselves, can dial a
# ClusterIP directly; the type only keeps the surface off the cluster's edge.
# What actually closes in-cluster reachability is `networkpolicy.yaml`'s
# default-deny ingress — read its header before relying on it, because a
# NetworkPolicy is silently inert on a cluster whose CNI does not enforce one.
#
# Reaching it is:
#
#     kubectl -n groundkit port-forward svc/groundkit 8765:8765
#
# which the cluster's own RBAC authorises and its audit log records. An Ingress
# is the same mistake as a LoadBalancer with a hostname attached; if this ever
# needs to be reachable from outside the cluster, what it needs first is
# authentication, which is a src/ change and an ADR, not a manifest.
apiVersion: v1
kind: Service
metadata:
  name: groundkit
  namespace: groundkit
  labels:
    app.kubernetes.io/name: groundkit
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: groundkit
    app.kubernetes.io/component: service
  ports:
    - name: http
      port: 8765
      targetPort: http
      protocol: TCP
